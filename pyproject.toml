# Shared development-tool configuration. This repository remains a scripts-based
# application rather than an installable Python package.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["models", "outputs", "work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These modules must prepare Windows llama.cpp DLL search paths before importing
# llama_cpp and the modules that depend on it.
"scripts/translate_srt_galtransl.py" = ["E402"]
"scripts/translate_srt_sakura.py" = ["E402"]
"scripts/translate_srt_sugoi.py" = ["E402"]
